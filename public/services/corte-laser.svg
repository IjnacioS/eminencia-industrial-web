<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Plancha base metálica -->
  <rect x="6" y="88" width="88" height="7" rx="2" fill="#e5d00e" stroke="#17212c" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Riel superior -->
  <line x1="6" y1="10" x2="94" y2="10" stroke="#17212c" stroke-width="3.5" stroke-linecap="round" />
  <rect x="10" y="14" width="80" height="7" rx="1.5" fill="#e5d00e" stroke="#17212c" stroke-width="2.5" />
  <line x1="50" y1="3" x2="50" y2="14" stroke="#17212c" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Cabezal de corte láser -->
  <rect x="30" y="21" width="40" height="12" rx="1" fill="#f1efe8" stroke="#17212c" stroke-width="2.8" stroke-linejoin="round" />
  <rect x="40" y="33" width="20" height="17" fill="#e5d00e" stroke="#17212c" stroke-width="2.8" stroke-linejoin="round" />
  <line x1="45" y1="41" x2="55" y2="41" stroke="#17212c" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Boquilla cónica -->
  <polygon points="42,50 58,50 54,60 46,60" fill="#f1efe8" stroke="#17212c" stroke-width="2.8" stroke-linejoin="round" />
  
  <!-- Haz láser central brillante -->
  <line x1="50" y1="60" x2="50" y2="88" stroke="#e5d00e" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="60" x2="50" y2="88" stroke="#17212c" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Chispas radiantes con contorno oscuro -->
  <g stroke="#17212c" stroke-width="2.8" stroke-linecap="round">
    <line x1="50" y1="88" x2="22" y2="68" />
    <line x1="50" y1="88" x2="38" y2="72" />
    <line x1="50" y1="88" x2="62" y2="72" />
    <line x1="50" y1="88" x2="78" y2="68" />
    <line x1="16" y1="78" x2="22" y2="78" />
    <line x1="78" y1="78" x2="84" y2="78" />
  </g>
  <g stroke="#e5d00e" stroke-width="1.4" stroke-linecap="round">
    <line x1="50" y1="88" x2="22" y2="68" />
    <line x1="50" y1="88" x2="38" y2="72" />
    <line x1="50" y1="88" x2="62" y2="72" />
    <line x1="50" y1="88" x2="78" y2="68" />
  </g>
</svg>
