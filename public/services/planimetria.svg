<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 1. Hoja de plano técnico con esquina doblada -->
  <path d="M 12,12 L 68,12 L 88,32 L 88,88 L 12,88 Z" fill="#ffffff" stroke="#17212c" stroke-width="3" stroke-linejoin="round" />
  <!-- Esquina doblada (dog-ear) -->
  <path d="M 68,12 L 68,32 L 88,32 Z" fill="#e5d00e" stroke="#17212c" stroke-width="2.5" stroke-linejoin="round" />

  <!-- 2. Grilla técnica de fondo sutil -->
  <g stroke="#17212c" stroke-opacity="0.15" stroke-width="1">
    <line x1="22" y1="22" x2="62" y2="22" />
    <line x1="22" y1="36" x2="78" y2="36" />
    <line x1="22" y1="50" x2="78" y2="50" />
    <line x1="22" y1="64" x2="78" y2="64" />
    <line x1="22" y1="78" x2="78" y2="78" />
    
    <line x1="22" y1="22" x2="22" y2="78" />
    <line x1="36" y1="22" x2="36" y2="78" />
    <line x1="50" y1="22" x2="50" y2="78" />
    <line x1="64" y1="22" x2="64" y2="78" />
    <line x1="78" y1="36" x2="78" y2="78" />
  </g>

  <!-- 3. Dibujo de pieza técnica / Planimetría central (en amarillo y negro) -->
  <polygon points="28,42 56,42 56,58 72,58 72,74 28,74" fill="#e5d00e" fill-opacity="0.25" stroke="#17212c" stroke-width="2.8" stroke-linejoin="round" />
  <circle cx="42" cy="58" r="5" fill="#ffffff" stroke="#17212c" stroke-width="2.2" />

  <!-- 4. Cotas y flechas de medición (Dimensionado técnico) -->
  <!-- Cota superior -->
  <line x1="28" y1="34" x2="56" y2="34" stroke="#17212c" stroke-width="1.8" stroke-linecap="round" />
  <line x1="28" y1="30" x2="28" y2="38" stroke="#17212c" stroke-width="1.8" />
  <line x1="56" y1="30" x2="56" y2="38" stroke="#17212c" stroke-width="1.8" />

  <!-- Cota lateral derecha -->
  <line x1="80" y1="58" x2="80" y2="74" stroke="#17212c" stroke-width="1.8" stroke-linecap="round" />
  <line x1="76" y1="58" x2="84" y2="58" stroke="#17212c" stroke-width="1.8" />
  <line x1="76" y1="74" x2="84" y2="74" stroke="#17212c" stroke-width="1.8" />

  <!-- 5. Escuadra técnica de dibujo sobre el plano -->
  <path d="M 44,20 L 78,54 L 44,54 Z" fill="#e5d00e" stroke="#17212c" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M 50,34 L 66,50 L 50,50 Z" fill="#ffffff" stroke="#17212c" stroke-width="1.8" stroke-linejoin="round" />
</svg>
