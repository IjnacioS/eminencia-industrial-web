<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Piezas metálicas en unión T -->
  <rect x="10" y="80" width="80" height="12" rx="1.5" fill="#f1efe8" stroke="#17212c" stroke-width="3" stroke-linejoin="round" />
  <rect x="44" y="38" width="12" height="42" rx="1.5" fill="#f1efe8" stroke="#17212c" stroke-width="3" stroke-linejoin="round" />

  <!-- Cordón de soldadura en los vértices -->
  <path d="M 38,80 Q 44,74 44,80" fill="#e5d00e" stroke="#17212c" stroke-width="2.5" />
  <path d="M 56,80 Q 62,74 62,80" fill="#e5d00e" stroke="#17212c" stroke-width="2.5" />

  <!-- Antorcha / Pistola de soldar en ángulo -->
  <g transform="rotate(35 50 50)">
    <!-- Mango -->
    <rect x="44" y="8" width="12" height="28" rx="2" fill="#17212c" stroke="#17212c" stroke-width="2" />
    <!-- Cuello -->
    <rect x="47" y="36" width="6" height="18" fill="#f1efe8" stroke="#17212c" stroke-width="2.5" />
    <!-- Tobera / Boquilla cónica -->
    <polygon points="45,54 55,54 53,68 47,68" fill="#e5d00e" stroke="#17212c" stroke-width="2.8" stroke-linejoin="round" />
    <!-- Alambre / Electrodo -->
    <line x1="50" y1="68" x2="50" y2="76" stroke="#17212c" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Chispas y destello de arco eléctrico -->
  <g stroke="#17212c" stroke-width="2.5" stroke-linecap="round">
    <line x1="56" y1="78" x2="72" y2="64" />
    <line x1="56" y1="78" x2="78" y2="78" />
    <line x1="44" y1="78" x2="26" y2="66" />
    <line x1="50" y1="76" x2="50" y2="60" />
  </g>
  <g stroke="#e5d00e" stroke-width="1.3" stroke-linecap="round">
    <line x1="56" y1="78" x2="72" y2="64" />
    <line x1="56" y1="78" x2="78" y2="78" />
    <line x1="44" y1="78" x2="26" y2="66" />
    <line x1="50" y1="76" x2="50" y2="60" />
  </g>
  <circle cx="50" cy="78" r="3.5" fill="#e5d00e" stroke="#17212c" stroke-width="2" />
</svg>
